# Runs proxy-cache-redis inside the official APISIX image (standalone mode,
# no etcd) against single Redis, Redis Sentinel and a 3-node Redis Cluster.
# Used by smoke.sh; see README.md in this folder.
services:
  apisix:
    image: apache/apisix:${APISIX_IMAGE_TAG:-3.21.0-debian}
    environment:
      - APISIX_STAND_ALONE=true
    volumes:
      - ../apisix:/opt/proxy-cache-redis/apisix:ro
      - ./conf/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./conf/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    ports:
      - "${APISIX_PORT:-9080}:9080"
    depends_on:
      redis:
        condition: service_started
      redis-sentinel:
        condition: service_healthy
      redis-cluster:
        condition: service_healthy
      backend:
        condition: service_started
    networks:
      pcr:
        ipv4_address: 172.30.0.10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      pcr:
        ipv4_address: 172.30.0.12

  # master + replica + one sentinel in one container, announced on a fixed IP
  redis-sentinel:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        redis-server --port 6379 --save "" --appendonly no --daemonize yes
        redis-server --port 6380 --replicaof 172.30.0.14 6379 --save "" --appendonly no \
          --replica-announce-ip 172.30.0.14 --daemonize yes
        cat > /tmp/sentinel.conf <<EOC
        port 26379
        sentinel announce-ip 172.30.0.14
        sentinel monitor mymaster 172.30.0.14 6379 1
        sentinel down-after-milliseconds mymaster 2000
        sentinel failover-timeout mymaster 5000
        EOC
        exec redis-server /tmp/sentinel.conf --sentinel
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 26379 sentinel get-master-addr-by-name mymaster | grep -q 172.30.0.14"]
      interval: 2s
      retries: 30
    networks:
      pcr:
        ipv4_address: 172.30.0.14

  # three cluster nodes in one container, announced on a fixed IP
  redis-cluster:
    image: redis:7-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for p in 7000 7001 7002; do
          redis-server --port $$p --cluster-enabled yes \
            --cluster-config-file /tmp/nodes-$$p.conf \
            --cluster-announce-ip 172.30.0.11 \
            --save "" --appendonly no --daemonize yes
        done
        sleep 1
        redis-cli --cluster create 172.30.0.11:7000 172.30.0.11:7001 172.30.0.11:7002 \
          --cluster-replicas 0 --cluster-yes
        tail -f /dev/null
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7000 cluster info | grep -q cluster_state:ok"]
      interval: 2s
      retries: 30
    networks:
      pcr:
        ipv4_address: 172.30.0.11

  backend:
    image: nginx:alpine
    volumes:
      - ./backend/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      pcr:
        ipv4_address: 172.30.0.13

networks:
  pcr:
    ipam:
      config:
        - subnet: 172.30.0.0/24
