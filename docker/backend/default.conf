# Every response body carries a unique request id, so a cache HIT is
# recognisable by returning the same body as the MISS before it.
server {
    listen 80;
    default_type text/plain;

    location ~ /vary/ {
        add_header Vary Accept-Language;
        add_header X-Upstream yes;
        return 200 "body-$request_id-$http_accept_language\n";
    }

    location ~ /nocache/ {
        add_header Cache-Control no-store;
        return 200 "body-$request_id\n";
    }

    location / {
        add_header X-Upstream yes;
        return 200 "body-$request_id\n";
    }
}
